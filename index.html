<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>taubat, bruh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ffffff;
      color: #111111;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
      user-select: none;
      position: relative;
    }

    h1 {
      font-size: clamp(1.75rem, 4.5vw, 3rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      color: #18181b;
      line-height: 1.3;
    }

    .footer {
      position: absolute;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.85rem;
      color: #71717a;
      user-select: auto;
    }

    .footer a {
      color: #18181b;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }

    .footer a:hover {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <h1>taubat, bruh</h1>

  <footer class="footer">
    powered by <a href="https://movianlife.com" target="_blank" rel="noopener noreferrer">movianlife</a>
  </footer>

  <script>
    (function updateDynamicTitle() {
      const host = window.location.hostname || window.location.host;
      if (host) {
        document.title = `taubat, bruh - ${host}`;
      } else {
        document.title = 'taubat, bruh';
      }
    })();
  </script>
</body>
</html>
